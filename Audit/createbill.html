            <div class="headercreatebill">

            <h1>Create Bill</h1>
            </div>
            <div class="cardsforbill">
                <div class="card1bill">

                    <span style="font-size: 18px; font-weight: bolder; color: rgb(36, 35, 35);">Search & Add Products</span><br>
                    <input type="text" placeholder="Search by name or barcode" id="barcodesearch">
                    <button class="search">Search</button>
                    <div class="cardbilladd"></div>

                </div>

                <div class="card2bill">
                    <div class="cart" style="padding-left: 20px; padding-top: 20px; color: rgb(45, 43, 43); font-size: 20px;">
                        <h3>Cart</h3>
                    </div>
                    <div class="itemshow">
                        <p>No item added</p>
                    </div>

                    <div class="calculation">
                        <div class="subtotal">
                            <span  class="span12">Subtotal</span>
                            <span class="span12">$0</span>
                        </div>
                        <div class="tax">
                            <Span class="span12">Tax</Span>
                            <span class="span12">$0</span>
                        </div>
                        <div class="total">
                            <span class="totalspan">Total</span>
                            <span class="totalspan">$0</span>
                        </div>

                    </div>
                    <p style="margin-left: 15px; margin-top: 15px;"> Payment method</p>
                    <div class="paymentmethod">
                        <div class="cash ">💵 Cash</div>
                        <div class="upi ">📱 UPI</div>
                    </div>
                    <div class="generatebill">
                        <button class="billg" >✓ Generate Bill</button>

                    </div>
                    <div class="addsales">
                        <button class="addsale1"> Save Sales</button>
                    </div>

                </div>
