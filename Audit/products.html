        <div class="maindiv1">
            <div>
                <h1 style="color: rgb(49, 49, 49);">Product Management</h1>
            </div>
            <div class="addproduct">
                <input type="text" placeholder="Search Products..." id="sarthak">
                <button class="buttonaddprodcut" style="cursor: pointer;">+ Add Product</button>
            </div>
        </div>


        <div class="tablemain">
        <div class="table100">
            <table class="table1">
                <thead>
                    <th class="th1">Product Name</th>
                    <th class="th1">Barcode</th>
                    <th class="th1">Category</th>
                    <th class="th1">Price</th>
                    <th class="th1">Quantity</th>
                    <th class="th1">Status</th>
                    <th class="th1">Action</th>
                </thead>
                <tbody class="tbody">
                   

                </tbody>



            </table>

        </div>

        <!-- add product  -->
         <div class="maindivform">
         <div class="addp">
            <form action="" class="form" id="mainfromaddproduct">
                <div class="addp1">
                    <div class="header">
                        <span style="color: rgb(63, 61, 61);">Add Product</span>
                        <button class="buttonx">x</button>
                    </div>
                    <div class="addp2">

                        <div style="margin-bottom: 20px; margin-top: 20px;">

                            <label for="prodcutname" class="prodcutname"
                                style="margin-bottom: 5px; display: inline-block; font-size: 16px; font-weight: 700; color: rgb(146, 143, 143);">Product
                                Name</label><br>
                            <input type="text" placeholder="Enter Prodcut Name" name="prodcutname" class="textinputproductname"
                                id="commontextinput" required autocomplete="off"> <br>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label for="barcode" class="barcode"
                                style="margin-bottom: 5px; display: inline-block;  font-size: 16px; font-weight: 700; color: rgb(146, 143, 143);">Barcode</label><br>
                            <input type="text" autocomplete="off" placeholder="Enter Barcode Number" id="commontextinput" class="barcode1" required><br>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label for="Category"
                                style="margin-bottom: 5px; display: inline-block;  font-size: 16px; font-weight: 700; color: rgb(146, 143, 143);">Category</label><br>
                            <select name="" id="category" class="dropdown">
                                <option value="Grocery" style="color: red; border-radius: 20px;">Grocery</option>
                                <option value="Dairy" style="height: 25px; width: 200px;">Dairy</option>
                                <option value="Beverages" style="height: 25px; width: 200px;">Beverages</option>
                                <option value="Snacks" style="height: 25px; width: 200px;">Snacks</option>
                            </select><br>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label for="sellingprice" 
                                style="margin-bottom: 5px; display: inline-block;  font-size: 16px; font-weight: 700; color: rgb(146, 143, 143);" >Selling
                                Price</label><br>
                            <input type="text" autocomplete="off" placeholder="Enter Selling price" id="commontextinput" class="sellingprice1" required><br>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label for="Quantity"
                                style="margin-bottom: 5px; display: inline-block;  font-size: 16px; font-weight: 700; color: rgb(146, 143, 143);">Quantity</label><br>
                            <input type="text" autocomplete="off" placeholder="Enter Quantity" id="commontextinput" class="quantity1" required><br>
                        </div>
                       <div class="buttons">
                            <button class="cancel" style="cursor: pointer;">Cancel</button>
                            <button class="add" type="submit" style="cursor: pointer ;">Add Product</button>
                        </div>
                    </div>
                     
                </div>

            </form>

        </div>
